description = "Declare what files you will modify before implementation"

prompt = """
Before implementing anything, resolve the active declaration path:

```bash
DECLARATION_FILE=$(bash ${CLAUDE_PLUGIN_ROOT}/hooks/resolve-declaration-file.sh)
echo "$DECLARATION_FILE"
```

Create the declaration at that exact path. Write this JSON to `$DECLARATION_FILE`:

```json
{
  "task": "[one sentence description of what you will do]",
  "files_to_touch": ["path/to/file1.py", "path/to/file2.py"],
  "files_not_to_touch": ["everything else"],
  "what_will_change": "[specific changes you will make]",
  "what_will_not_change": "[what stays the same]",
  "done_when": "[measurable criteria for completion]",
  "approved": false
}
```

After writing the declaration file, show the path and contents to the user in a clear format and wait for them to say "proceed" before making any changes.

When the user says "proceed", update that same declaration file to set `"approved": true`.

Only then may you write to the declared files. This includes shell-based edits and file mutations through `exec_command` such as `cp`, `mv`, `touch`, `mkdir`, `perl -i`, `sed -i`, redirections (`>`), or similar shortcuts.

If you discover you need to touch a file not in the declaration, you must:
1. Stop
2. Update the declaration with the new file
3. Show the updated declaration
4. Wait for approval again

Do not bypass the declaration with shell write tricks if `apply_patch` is blocked. Update the declaration instead.
"""
