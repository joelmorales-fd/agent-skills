description = "Clear the current declaration to start a new task"

prompt = """
Run this command to clear the current declaration:

```bash
bash ${CLAUDE_PLUGIN_ROOT}/hooks/clear-declaration.sh
```

This removes `/tmp/claude-declaration.json` so you can start fresh with a new task.

Use this when:
- The current task is complete
- You want to abandon the current task
- You want to start a different task
"""
