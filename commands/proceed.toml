description = "Approve the current declaration and allow writes"

prompt = """
Resolve the active declaration path first:

```bash
DECLARATION_FILE=$(bash ${CLAUDE_PLUGIN_ROOT}/hooks/resolve-declaration-file.sh)
echo "$DECLARATION_FILE"
```

The user has approved the declaration. Update that file to set `"approved": true`.

Then proceed with the implementation, touching ONLY the files listed in `files_to_touch`.

If you discover you need additional files not in the declaration:
1. Stop immediately
2. Inform the user
3. Update the declaration with the new files
4. Set `"approved": false`
5. Wait for the user to say "proceed" again

Do not add "bonus" functionality. Do not touch files outside the declaration. Do not bypass the declaration with `exec_command`, shell redirections, `cp`, `mv`, `perl -i`, `sed -i`, or other file-writing shell commands. When the declared scope is complete, stop.
"""
