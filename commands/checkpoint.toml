description = "Create a session checkpoint — summarize state and prepare for /compact or new session"

prompt = """
Create a checkpoint for session continuity. You MUST create a file at the end.

## Step 1: Get Current Directory

First, run: `pwd` to capture the working directory. Store this path — you'll use it in Steps 2 and 4.

## Step 2: Create Directory

Run: `mkdir -p [FULL_PATH_FROM_STEP_1]/.handoff`

Example: If pwd returned `/Users/me/src/myproject`, run `mkdir -p /Users/me/src/myproject/.handoff`

## Step 3: Summarize Current State

Prepare this content (fill in the [bracketed] sections):

```markdown
# Session Checkpoint

**Created**: [timestamp]
**Working Directory**: [full path from pwd]
**Turns**: ~[estimate]

## Current Task
[What we're working on]

## Progress
- [x] [Completed items]
- [ ] [Remaining items]

## Key Decisions Made
1. [Decision] — [Why]

## Files Modified
- [file paths]

## Next Step
[Exact next action to take]

---

## Resume Instructions (For Next Session)

**To continue this work:**

1. First, change to the working directory: `cd [full path]`
2. Read this checkpoint file completely
3. Run the verification command below to confirm state
4. Continue from "Next Step" above

**Verification command:**
```bash
cd [full path] && git status
```

**Do NOT:**
- Re-debate decisions listed above
- Start over from scratch
- Modify files not related to the current task
- Work in a different directory
```

## Step 4: Save Checkpoint (REQUIRED)

Use the Write tool to create the file at the FULL PATH:
`[FULL_PATH_FROM_STEP_1]/.handoff/checkpoint-YYYY-MM-DD.md`

Example: `/Users/me/src/myproject/.handoff/checkpoint-2026-06-18.md`

Replace YYYY-MM-DD with today's date.

THIS IS MANDATORY - you must actually create this file using the FULL ABSOLUTE PATH, not a relative path.

## Step 5: Confirm to User

After creating the file, tell the user:

```
✓ Checkpoint saved to .handoff/checkpoint-[date].md

To continue in a NEW session:
1. Start fresh session
2. Say: "Load .handoff/checkpoint-[date].md and continue from where we left off"

Or stay in this session:
1. Run /compact to reduce context
2. Continue working

Current turn estimate: ~[N] turns
```

## When to Use

- Before context gets too large (~25+ turns)
- Before switching to a different task
- When quality seems to be degrading
- Before ending a work session
"""
